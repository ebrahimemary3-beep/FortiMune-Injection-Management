<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>FortiMune — استعادة كلمة المرور</title><style>body{margin:0;background:#eef6fa;color:#16364c;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{box-sizing:border-box;background:white;border-radius:24px;padding:28px;width:min(92%,440px);box-shadow:0 18px 60px #16364c15}img{width:80px}h1{font-size:24px}label{display:block;margin:18px 0 8px}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;font:inherit}input{border:1px solid #cddde7}button{border:0;background:#0870ab;color:white;margin-top:20px;cursor:pointer}#message{line-height:1.6;padding:12px;border-radius:12px;background:#edf6fa}small{color:#677d8e}a{color:#0870ab}</style></head><body><main><img src="fortimune-logo.png" alt="FortiMune"><h1>استعادة كلمة المرور</h1><p id="message" role="status">جارٍ التحقق من رابط الاستعادة…</p><form id="resetForm" hidden><label for="newPassword">كلمة المرور الجديدة — New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><label for="confirmPassword">تأكيد كلمة المرور — Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><small>٨ أحرف على الأقل، ويفضل كلمة مرور طويلة وفريدة.</small><button id="savePassword">حفظ كلمة المرور</button></form><a href="./index.html">العودة لتسجيل الدخول</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const FORTIMUNE_SUPABASE_URL="https://wysthgotuzqqidsxyobw.supabase.co";
const FORTIMUNE_SUPABASE_PUBLISHABLE_KEY="sb_publishable_OcrZKZ_wXEpnypKNGA_gCA_BULRAoUC";
const client=window.supabase.createClient(FORTIMUNE_SUPABASE_URL,FORTIMUNE_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});let verified=false;
const message=document.getElementById('message'),form=document.getElementById('resetForm');
(async()=>{try{const hash=new URLSearchParams(location.hash.slice(1)),params=new URLSearchParams(location.search);if(hash.get('error')||params.get('error'))throw Error('رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا.');let result;if(hash.get('type')==='recovery'&&hash.get('access_token')&&hash.get('refresh_token')){result=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});}else if(params.get('token_hash')&&params.get('type')==='recovery'){result=await client.auth.verifyOtp({token_hash:params.get('token_hash'),type:'recovery'});}else throw Error('افتح رابط الاستعادة المرسل إلى إيميلك الرسمي.');history.replaceState(null,'',location.pathname);if(result.error)throw result.error;if(!result.data?.session)throw Error('تعذر التحقق من الرابط.');verified=true;form.hidden=false;message.textContent='اختار كلمة مرور جديدة للتطبيق. كلمة مرور Outlook لا تتغيّر.';}catch(e){history.replaceState(null,'',location.pathname);message.textContent=e.message;}})();
form.onsubmit=async event=>{event.preventDefault();if(!verified)return;const password=document.getElementById('newPassword').value,confirm=document.getElementById('confirmPassword').value;if(password.length<8||password!==confirm){message.textContent='راجع طول كلمة المرور وتطابق التأكيد.';return;}const button=document.getElementById('savePassword');button.disabled=true;try{const {error}=await client.auth.updateUser({password});if(error)throw error;verified=false;form.hidden=true;await client.auth.signOut();message.textContent='✓ تم تغيير كلمة مرور التطبيق بنجاح. ارجع للتطبيق وسجّل الدخول بالباسورد الجديد.';message.style.background='#e6f7ed';}catch(e){message.textContent=e.message;}finally{button.disabled=false;}};
</script></body></html>
